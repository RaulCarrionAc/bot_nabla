services:
  openwa-api:
    image: ghcr.io/rmyndharis/openwa:v0.1.6
    container_name: openwa-api
    mem_limit: 700m
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=production
      - PORT=2785
      - HOME=/tmp
      - DATABASE_TYPE=sqlite
      - DATABASE_NAME=/app/data/openwa.sqlite
      - DATABASE_SYNCHRONIZE=true
      - ENGINE_TYPE=${ENGINE_TYPE:-whatsapp-web.js}
      - SESSION_DATA_PATH=/app/data/sessions
      - PUPPETEER_HEADLESS=true
      - PUPPETEER_ARGS=--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu,--single-process,--no-zygote,--ignore-certificate-errors
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/data/media
      - API_MASTER_KEY=${API_MASTER_KEY}
      - RESOLVE_LID_TO_PHONE=true
    volumes:
      - ./data/openwa:/app/data
    shm_size: '256mb'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:2785/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - nabla-network

  nabla-webhook:
    build:
      context: .
      dockerfile: Dockerfile.webhook
    container_name: nabla-webhook
    mem_limit: 512m
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - ./data:/app/data
    depends_on:
      openwa-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      nabla-network:
        aliases:
          - webhook.nabla.net
  nabla-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot_prod
    container_name: nabla-bot
    mem_limit: 64m
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      openwa-api:
        condition: service_healthy
      nabla-webhook:
        condition: service_healthy
    networks:
      - nabla-network

networks:
  nabla-network:
    name: nabla-network
